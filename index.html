<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sankou Wamono Order System</title>
<style>
  /* === 基本設定 === */
  body { font-family: "Helvetica Neue", Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; color: #333; }
  h2 { text-align: center; margin-bottom: 20px; font-size: 1.5rem; }

  /* === 検索バー === */
  .search-container {
    max-width: 600px; margin: 0 auto 20px auto; position: relative;
  }
  .search-input {
    width: 100%; padding: 12px 15px; border: 2px solid #ddd; border-radius: 25px; font-size: 16px; box-sizing: border-box; outline: none;
  }
  .search-input:focus { border-color: #333; }

  /* === 商品リスト === */
  .product-grid { 
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 15px; max-width: 1200px; margin: 0 auto;
  }
  @media (max-width: 600px) {
    .product-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    body { padding: 10px; }
  }

  /* === 商品カード === */
  .item {
    background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px; text-align: center;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .item.selected { border: 2px solid #333; background-color: #fffbf0; }
  .img-container {
    width: 100%; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
    background: #fafafa; margin-bottom: 8px; border-radius: 4px; overflow: hidden; cursor: zoom-in;
  }
  .item img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .hinban { font-weight: bold; font-size: 14px; margin-bottom: 4px; word-break: break-all; }
  .price { color: #d32f2f; font-weight: bold; font-size: 15px; margin-bottom: 10px; }

  /* === 数量 === */
  .stepper { display: flex; align-items: center; justify-content: center; gap: 5px; }
  .step-btn { width: 30px; height: 30px; background: #eee; border: none; border-radius: 4px; font-size: 18px; cursor: pointer; }
  .order-qty { width: 40px; text-align: center; border: none; font-size: 16px; font-weight: bold; background: transparent; }
  
  /* === フッター === */
  .footer-form {
    max-width: 600px; margin: 40px auto; background: #fff; padding: 25px;
    border-radius: 8px; border-top: 5px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
  .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
  .submit-btn { width: 100%; padding: 15px; background: #000; color: #fff; font-size: 18px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
  .submit-btn:disabled { background: #999; }

  /* === Lightbox === */
  #lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; display: none; align-items: center; justify-content: center; cursor: zoom-out; }
  #lightbox img { max-width: 90%; max-height: 90%; border-radius: 4px; }

  /* === 状態表示 === */
  #loading { text-align: center; padding: 50px; font-size: 16px; color: #666; }
  #shop-container { display: none; }
  #thanks-screen { display: none; text-align: center; padding: 60px 20px; }
  .error-msg { color: red; text-align: center; margin-top: 10px; display: none; }
</style>
</head>
<body>

<div id="lightbox" onclick="closeLightbox()"><img id="lightbox-img" src=""></div>

<div id="loading">
  <p>商品データを読み込み中...</p>
  <p style="font-size:12px;">(これには数秒かかる場合があります)</p>
</div>

<div id="shop-container">
  <h2>商品カタログ</h2>
  <div class="search-container">
    <input type="text" id="search-box" class="search-input" placeholder="品番で検索 (例: 050, RDWH)..." onkeyup="filterProducts()">
  </div>

  <div class="product-grid" id="product-list"></div>

  <div class="footer-form">
    <h3>お届け先情報</h3>
    <div class="form-group"><label>会社名 <span style="color:red">*</span></label><input type="text" id="kaisha" placeholder="例: 株式会社サンプル"></div>
    <div class="form-group"><label>ご担当者名 <span style="color:red">*</span></label><input type="text" id="tantousha" placeholder="例: 山田 太郎"></div>
    <div class="form-group"><label>メールアドレス <span style="color:red">*</span></label><input type="email" id="mail" placeholder="例: info@example.com"></div>
    <div class="form-group"><label>電話番号 <span style="color:red">*</span></label><input type="tel" id="tel" placeholder="例: 03-1234-5678"></div>
    <div class="form-group"><label>備考</label><textarea id="bikou" rows="3" placeholder="ご要望などあればご記入ください"></textarea></div>
    <button class="submit-btn" onclick="sendOrder()">注文を確定する</button>
    <div id="submit-error" class="error-msg"></div>
  </div>
</div>

<div id="thanks-screen">
  <h2 style="color:#2ecc71;">ご注文ありがとうございました</h2>
  <p>ご入力いただいたメールアドレスへ確認メールを送信しました。</p>
  <p>担当者より改めてご連絡いたします。</p>
  <br>
  <button onclick="location.reload()" style="padding:10px 20px; border:1px solid #ddd; background:#fff; cursor:pointer;">トップに戻る</button>
</div>

<script>
  // ★最新のGAS URL
  const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxR2bBiV6OAdQtNuT190TJBFyRkubhj2DA7LqXv9Z870eOh_0hs0VdlazXvNjWBIcnq/exec';

  let allProducts = [];

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const response = await fetch(`${GAS_API_URL}?op=getProducts`);
      const data = await response.json();
      if (data.ok) {
        allProducts = data.products;
        renderProducts(allProducts);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('shop-container').style.display = 'block';
      } else { throw new Error(data.error); }
    } catch (e) {
      document.getElementById('loading').innerHTML = `<span style="color:red;">読み込み失敗。再読み込みしてください。</span>`;
    }
  });

  function renderProducts(products) {
    const container = document.getElementById('product-list');
    container.innerHTML = '';
    if (products.length === 0) { container.innerHTML = '<p style="grid-column: 1/-1; text-align:center;">該当なし</p>'; return; }
    
    products.forEach(p => {
      const imgSrc = p.imageId ? `https://lh3.googleusercontent.com/d/${p.imageId}=s600` : 'https://via.placeholder.com/150x150?text=No+Image';
      const html = `
        <div class="item" data-hinban="${p.hinban}" data-price="${p.price}">
          <div class="img-container" onclick="openLightbox('${imgSrc}')">
            <img src="${imgSrc}" loading="lazy" alt="${p.hinban}" referrerpolicy="no-referrer">
          </div>
          <div class="hinban">${p.hinban}</div>
          <div class="price">¥${Number(p.price).toLocaleString()}</div>
          <div class="stepper">
            <button class="step-btn" onclick="updateQty(this, -1)">-</button>
            <input type="number" class="order-qty" min="0" value="0" readonly>
            <button class="step-btn" onclick="updateQty(this, 1)">+</button>
          </div>
        </div>`;
      container.insertAdjacentHTML('beforeend', html);
    });
  }

  function filterProducts() {
    const term = document.getElementById('search-box').value.toLowerCase().trim();
    renderProducts(allProducts.filter(p => p.hinban.toLowerCase().includes(term)));
  }

  function updateQty(btn, change) {
    const input = btn.parentElement.querySelector('.order-qty');
    let val = Math.max(0, (parseInt(input.value, 10) || 0) + change);
    input.value = val;
    val > 0 ? btn.closest('.item').classList.add('selected') : btn.closest('.item').classList.remove('selected');
  }

  function openLightbox(src) {
    if (src.includes('placeholder')) return;
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').style.display = 'flex';
  }
  function closeLightbox() { document.getElementById('lightbox').style.display = 'none'; }

  async function sendOrder() {
    const items = [];
    // ★DOM依存ではなく、現在のリストから取得するが、検索で見えてない商品は送れない仕様に注意。
    // (全商品から送りたい場合は allProducts と照合する必要があるが、現状はDOM走査で十分)
    document.querySelectorAll('.item').forEach(el => {
      const q = parseInt(el.querySelector('.order-qty').value, 10) || 0;
      if (q > 0) items.push({ hinban: el.dataset.hinban, joudai: Number(el.dataset.price), suryo: q });
    });

    if (items.length === 0) { alert("商品を選択してください。"); return; }

    const form = {
      kaisha: document.getElementById('kaisha').value.trim(),
      tantousha: document.getElementById('tantousha').value.trim(),
      mail: document.getElementById('mail').value.trim(),
      tel: document.getElementById('tel').value.trim(),
      bikou: document.getElementById('bikou').value.trim(),
      items: items
    };

    if (!form.kaisha || !form.tantousha || !form.mail || !form.tel) { alert("必須項目(*)を入力してください。"); return; }

    const btn = document.querySelector('.submit-btn');
    btn.disabled = true;
    btn.innerText = "送信中...";
    document.getElementById('submit-error').style.display = 'none';

    try {
      const response = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(form)
      });
      const resData = await response.json();

      if (resData.ok) {
        // ★修正点：成功時にアラートを出し、確実にスクロールさせる
        alert("注文が完了しました！");
        window.scrollTo({ top: 0, behavior: 'smooth' });
        document.getElementById('shop-container').style.display = 'none';
        document.getElementById('thanks-screen').style.display = 'block';
      } else { throw new Error(resData.error || '不明なエラー'); }

    } catch (e) {
      console.error(e);
      btn.disabled = false;
      btn.innerText = "注文を確定する";
      document.getElementById('submit-error').innerText = "エラー: " + e.message;
      document.getElementById('submit-error').style.display = "block";
      alert("送信に失敗しました。時間をおいて再度お試しください。");
    }
  }
</script>
</body>
</html>
